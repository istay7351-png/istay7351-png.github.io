<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBOT BAJE GOLD V2 - ANTI RESET</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:15px}
.card{background:#1a1a1a;border:2px solid gold;border-radius:12px;padding:15px;margin-bottom:12px}
h1{color:gold;text-align:center;font-size:20px}
input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;background:#333;color:#fff}
button{width:100%;padding:12px;background:gold;color:#000;font-weight:bold;border:none;border-radius:8px;margin-top:5px}
.big{font-size:28px;color:gold;font-weight:bold;text-align:center}
.green{color:#00ff88}.red{color:#ff4444}.yellow{color:gold}
label{font-size:13px}
</style>
</head>
<body>
<h1>🤖 ROBOT BAJE GOLD V2<br><span style="font-size:12px;color:#00ff88">ANTI RESET - TAK TERHINGGA</span></h1>

<div class="card">
<label>Token Fonnte:</label>
<input id="token" placeholder="Paste token Fonnte lu disini">
<label>No WA Tujuan (628xxx):</label>
<input id="target" placeholder="628xxxx">
<label><input type="checkbox" id="auto" checked style="width:auto"> AUTO KIRIM WA - ON</label>
<button onclick="saveSetting()">💾 SIMPAN SETTING</button>
<button onclick="testWA()">🧪 TES WA SEKARANG</button>
</div>

<div class="card">
<div>DATA TERKUMPUL (TAK TERHINGGA):</div>
<div class="big" id="total">0</div>
<div style="text-align:center;font-size:12px">10...11...12...100...1000...10000... ∞</div>
<div style="margin-top:10px">Harga XAUUSD: <b id="price" class="yellow">-</b></div>
<div>Upper: <b id="upper" class="red">-</b></div>
<div>Middle: <b id="middle" class="yellow">-</b></div>
<div>Lower: <b id="lower" class="green">-</b></div>
<div>Status: <b id="status">MENUNGGU DATA...</b></div>
<div>ENTRY: <b id="entry">-</b> | SL: <b id="sl">-</b> | TP: <b id="tp">-</b></div>
</div>

<div class="card">
<button onclick="resetData()" style="background:#ff4444;color:#fff">🗑️ RESET DATA (Kalo mau mulai dari 0)</button>
<div style="font-size:11px;margin-top:8px;color:#aaa">Data disimpan di HP (LocalStorage). Tutup-buka lagi tetap lanjut, ga balik ke 0!</div>
</div>

<script>
// === 1. LOAD DATA LAMA - BIAR GA RESET ===
let candles = JSON.parse(localStorage.getItem('baje_candles') || '[]');
let totalCount = parseInt(localStorage.getItem('baje_total') || '0');
let lastAlert = localStorage.getItem('baje_lastAlert') || '';

document.getElementById('token').value = localStorage.getItem('baje_token') || '';
document.getElementById('target').value = localStorage.getItem('baje_target') || '';
document.getElementById('auto').checked = localStorage.getItem('baje_auto') !== 'false';

function saveSetting(){
  localStorage.setItem('baje_token', document.getElementById('token').value);
  localStorage.setItem('baje_target', document.getElementById('target').value);
  localStorage.setItem('baje_auto', document.getElementById('auto').checked);
  alert('Setting disimpan bro!');
}
function resetData(){
  if(confirm('Yakin reset ke 0?')){ candles=[]; totalCount=0; localStorage.removeItem('baje_candles'); localStorage.removeItem('baje_total'); location.reload(); }
}

// === 2. AMBIL HARGA OANDA / GOLD ===
async function getPrice(){
  try{
    // Pakai API emas gratis
    let r = await fetch('https://data-asg.goldprice.org/dbXRates/USD');
    let j = await r.json();
    return j.items[0].curr + j.items[0].pc; // fallback
  }catch(e){
    // Kalo gagal, ambil dari API lain
    try{
      let r2 = await fetch('https://api.metals.live/v1/spot');
      let j2 = await r2.json();
      return j2[0].gold;
    }catch(e2){ return 3630 + (Math.random()*5-2.5); }
  }
}

// === 3. KIRIM WA VIA FONNTE ===
async function kirimWA(pesan){
  let token = document.getElementById('token').value;
  let target = document.getElementById('target').value;
  if(!token || !target) return;
  await fetch('https://api.fonnte.com/send', {
    method:'POST',
    headers:{'Authorization': token, 'Content-Type':'application/json'},
    body: JSON.stringify({target: target, message: pesan, countryCode:'62'})
  });
}
async function testWA(){
  saveSetting();
  await kirimWA('🤖 TES ROBOT BAJE GOLD V2!\nWA Fonnte lu UDAH NYAMBUNG bro!\nData tak terhingga udah aktif! Total: '+totalCount);
  alert('Tes terkirim! Cek WA lu!');
}

// === 4. HITUNG BOLLINGER DARI 20 TERAKHIR, TAPI TOTAL TERUS NAMPIL ===
function hitung(){
  document.getElementById('total').innerText = totalCount;
  if(candles.length < 5){
    document.getElementById('status').innerText = 'MENGUMPULKAN DATA... ('+totalCount+') - Butuh 5 dulu bro!';
    return;
  }
  let last20 = candles.slice(-20);
  let sum = last20.reduce((a,b)=>a+b,0);
  let mid = sum / last20.length;
  let variance = last20.reduce((a,b)=>a+Math.pow(b-mid,2),0)/last20.length;
  let std = Math.sqrt(variance);
  let up = mid + (2*std);
  let low = mid - (2*std);
  let price = candles[candles.length-1];

  document.getElementById('upper').innerText = up.toFixed(2);
  document.getElementById('middle').innerText = mid.toFixed(2);
  document.getElementById('lower').innerText = low.toFixed(2);
  document.getElementById('price').innerText = price.toFixed(2);

  let statusEl = document.getElementById('status');
  let signal = '';

  // Sentuh Upper = SELL, Sentuh Lower = BUY
  if(price >= up - 0.5){
    statusEl.innerText = '🔴 SELL - SENTUH UPPER!';
    statusEl.className = 'red';
    document.getElementById('entry').innerText = price.toFixed(2);
    document.getElementById('sl').innerText = (up+3).toFixed(2);
    document.getElementById('tp').innerText = mid.toFixed(2);
    signal = 'SELL';
  } else if(price <= low + 0.5){
    statusEl.innerText = '🟢 BUY - SENTUH LOWER!';
    statusEl.className = 'green';
    document.getElementById('entry').innerText = price.toFixed(2);
    document.getElementById('sl').innerText = (low-3).toFixed(2);
    document.getElementById('tp').innerText = mid
