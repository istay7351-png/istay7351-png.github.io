<body>
<div style="display:flex;justify-content:space-between;align-items:center">

</div>

<div class="box">
<canvas id="c" width="600" height="300"></canvas>

<div style="display:flex;gap:8px;margin-top:12px">

<div style="flex:1;background:#0f141e;padding:12px;border-radius:10px;text-align:center"><div style="font-size:10px;opacity:0.5">BASIS<br>MID</div><div style="font-weight:bold;margin-top:4px">4,285.30</div></div>

</div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
function D(){
X.clearRect(0,0,600,300);
X.strokeStyle='#1e252f';
for(let i=0;i<6;i++){X.beginPath();X.moveTo(0,i*50);X.lineTo(600,i*50);X.stroke();}
let p=140,b=[];
for(let i=0;i<60;i++){p+=(Math.random()-0.46)*7;b.push(p);}
X.strokeStyle='#ffd700';X.lineWidth=3;X.beginPath();
b.forEach((v,i)=>{let px=i*10,py=240-v;if(i==0)X.moveTo(px,py);else X.lineTo(px,py)});X.stroke();
X.strokeStyle='rgba(255,80,80,0.7)';X.setLineDash([7,4]);X.beginPath();
b.forEach((v,i)=>{let px=i*10,py=240-v-30;if(i==0)X.moveTo(px,py);else X.lineTo(px,py)});X.stroke();
X.strokeStyle='rgba(0,255,136,0.7)';X.beginPath();
b.forEach((v,i)=>{let px=i*10,py=240-v+30;if(i==0)X.moveTo(px,py);else X.lineTo(px,py)});X.stroke();
X.setLineDash([]);
X.fillStyle='#ffd700';X.beginPath();X.arc(590,240-b[59],7,0,Math.PI*2);X.fill();
}
D();setInterval(D,2000);
let pr=4285.3;
setInterval(()=>{pr+=(Math.random()-0.5)*1.8;document.getElementById('pr').innerText='$'+pr.toFixed(2)},900);
</script>
